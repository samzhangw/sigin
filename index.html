<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第八節意願調查系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1><i class="fas fa-school"></i> 調查系統</h1>
  </header>

  <main class="main-content">
    <div class="container">
      <h2><i class="fas fa-clipboard-check"></i> 第八節意願調查</h2>
      
      <div class="instructions-button-container">
        <button type="button" id="showInstructions" class="pulse-button"><i class="fas fa-info-circle"></i> 查看使用說明</button>
      </div>
      
      <form id="surveyForm">
        <label for="studentId"><i class="fas fa-id-card"></i> 學號：</label>
        <input type="text" id="studentId" name="studentId" required>
        
        <label for="name"><i class="fas fa-user"></i> 姓名：</label>
        <input type="text" id="name" name="name" required>
        
        <label for="class"><i class="fas fa-chalkboard-teacher"></i> 班級：</label>
        <input type="text" id="class" name="class" required>
        
        <label for="intention"><i class="fas fa-check-circle"></i> 第八節意願：</label>
        <select id="intention" name="intention" required>
          <option value="">請選擇</option>
          <option value="參加">參加</option>
          <option value="不參加">不參加</option>
        </select>
        
        <div id="reasonContainer" style="display:none;">
          <label for="reason"><i class="fas fa-comment-alt"></i> 不參加原因：</label>
          <textarea id="reason" name="reason"></textarea>
        </div>
        
        <label for="signature"><i class="fas fa-signature"></i> 家長簽名：</label>
        <button type="button" id="openSignature"><i class="fas fa-pen-fancy"></i> 開啟簽名板</button>
        <div class="signature-status unsigned">
          <div class="status-icon"></div>
          <span class="status-text">尚未簽名</span>
        </div>
        
        <div class="cf-turnstile" data-sitekey="0x4AAAAAABA6Z9ZJMniYyMes" data-theme="light"></div>
        
        <button type="submit"><i class="fas fa-paper-plane"></i> 提交調查</button>
      </form>
      
      <div id="loading">
        <div class="spinner"></div>
        <p>提交中，請稍候...</p>
      </div>
      
      <div id="result"></div>

      <button class="query-system-button" onclick="location.href='https://samzhangw.github.io/sigin/search'">
        <i class="fas fa-search"></i> 進入查詢系統
      </button>
    </div>
  </main>

  <div id="signatureModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-signature"></i> 家長簽名</h2>
      <canvas id="signatureCanvas" width="400" height="200"></canvas>
      <div class="signature-buttons">
        <button id="clearSignature"><i class="fas fa-eraser"></i> 清除簽名</button>
        <button id="saveSignature"><i class="fas fa-save"></i> 保存簽名</button>
      </div>
    </div>
  </div>

  <div id="alertModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-exclamation-circle"></i> 提示</h2>
      <p id="alertMessage"></p>
    </div>
  </div>

  <div id="confirmModal" class="confirm-modal">
    <div class="confirm-content">
      <h2><i class="fas fa-question-circle"></i> 確認提交</h2>
      <p>您確定要提交這份調查嗎？提交後將無法修改。</p>
      <div class="confirm-buttons">
        <button id="confirmSubmit"><i class="fas fa-check"></i> 確認提交</button>
        <button id="cancelSubmit"><i class="fas fa-times"></i> 取消</button>
      </div>
    </div>
  </div>

  <div id="deleteConfirmModal" class="confirm-modal">
    <div class="confirm-content">
      <h2><i class="fas fa-trash-alt"></i> 確認刪除</h2>
      <p>您確定要刪除簽名嗎？此操作無法撤銷。</p>
      <div class="confirm-buttons">
        <button id="confirmDelete"><i class="fas fa-check"></i> 確認刪除</button>
        <button id="cancelDelete"><i class="fas fa-times"></i> 取消</button>
      </div>
    </div>
  </div>

  <div id="instructionsModal" class="instructions-modal">
    <div class="instructions-content">
      <h3><i class="fas fa-info-circle"></i> 使用說明</h3>
      <ol>
        <li>填寫<strong>學號</strong>、<strong>姓名</strong>及<strong>班級</strong>等基本資料</li>
        <li>選擇是否<strong>參加第八節</strong>，若選擇「不參加」請填寫原因</li>
        <li>點擊「開啟簽名板」完成<strong>家長簽名</strong></li>
        <li>完成<strong>人機驗證</strong>後提交表單</li>
        <li>提交後可點擊下方查詢按鈕確認繳交狀況</li>
      </ol>
      <p class="note"><i class="fas fa-exclamation-triangle"></i> 注意：所有資料填寫完整且家長簽名後才能成功提交！</p>
      <button id="closeInstructions" class="close-instructions">了解</button>
    </div>
  </div>

  <footer class="copyright">
    <div class="copyright-logo">
      <i class="fas fa-school"></i>
    </div>
    <div class="copyright-text">
      <i class="far fa-copyright"></i> <span id="currentYear"></span> 第八節意願調查系統
    </div>
    <div>版權所有</div>
  </footer>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="script.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
