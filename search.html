<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Add mobile theme color for better mobile browser integration -->
  <meta name="theme-color" content="#4a90e2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>第八節意願調查系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="search-styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header class="header">
    <h1><i class="fas fa-search"></i> 調查系統查詢</h1>
  </header>

  <main class="main-content">
    <div class="container" data-aos="fade-up" data-aos-duration="800">
      <h2><i class="fas fa-database"></i> 第八節意願查詢</h2>
      
      <button id="helpButton" class="help-button" type="button">
        <i class="fas fa-question-circle"></i> 使用說明
      </button>
      
      <form id="searchForm">
        <div class="search-options">
          <label>
            <input type="radio" name="searchType" value="student" checked>
            <span>學生查詢</span>
          </label>
          <label>
            <input type="radio" name="searchType" value="class">
            <span>班級查詢</span>
          </label>
        </div>
        
        <div id="studentSearch">
          <label for="searchStudentId"><i class="fas fa-id-card"></i> 學號：</label>
          <input type="text" id="searchStudentId" name="searchStudentId" placeholder="請輸入學號">
        </div>
        
        <div id="classSearch" style="display:none;">
          <label for="searchClass"><i class="fas fa-chalkboard-teacher"></i> 班級：</label>
          <input type="text" id="searchClass" name="searchClass" placeholder="請輸入班級">
        </div>
        
        <div class="captcha-container">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAABA6Z9ZJMniYyMes"></div>
        </div>
        
        <button type="submit"><i class="fas fa-search"></i> 查詢</button>
      </form>
      
      <div id="searchLoading" class="loading-container">
        <div class="spinner"></div>
        <p>查詢中，請稍候...</p>
      </div>
      
      <div id="searchResults">
        <!-- 查詢結果將顯示在這裡 -->
      </div>
      
      <button class="return-button" onclick="location.href='index.html'">
        <i class="fas fa-arrow-left"></i> 返回意願調查
      </button>
      
      <button class="admin-button" onclick="location.href='admin.html'">
        <i class="fas fa-cog"></i> 管理系統設定
      </button>
    </div>
  </main>
  
  <div id="helpModal" class="modal">
    <div class="modal-content help-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-info-circle"></i> 查詢系統使用說明</h2>
      
      <div class="help-section">
        <h3><i class="fas fa-search"></i> 如何查詢調查結果</h3>
        <ol>
          <li>選擇查詢方式：<strong>「學生查詢」</strong>或<strong>「班級查詢」</strong></li>
          <li>輸入<strong>學號</strong>或<strong>班級</strong></li>
          <li>完成<strong>人機驗證</strong></li>
          <li>點擊<strong>「查詢」</strong>按鈕</li>
        </ol>
      </div>
      
      <div class="help-section">
        <h3><i class="fas fa-info-circle"></i> 查詢結果說明</h3>
        <p><strong>學生查詢</strong>：顯示該學生的填寫資料，包含意願選擇和家長簽名</p>
        <p><strong>班級查詢</strong>：顯示全班學生的填寫統計和個別填寫資料</p>
      </div>
      
      <div class="help-note">
        <p><i class="fas fa-exclamation-triangle"></i> 注意事項：</p>
        <ul>
          <li>學生查詢請輸入<strong>完整學號</strong></li>
          <li>班級查詢請使用<strong>標準班級格式</strong>（例如：301）</li>
          <li>若顯示未找到資料，表示該學生或班級尚未填寫調查</li>
        </ul>
      </div>
    </div>
  </div>
  
  <div id="searchAlertModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-exclamation-circle"></i> 提示</h2>
      <p id="searchAlertMessage"></p>
    </div>
  </div>

  <footer class="copyright">
    <span id="currentYear"></span> 第八節意願調查系統. 版權所有.
  </footer>

  <script src="search-script.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
