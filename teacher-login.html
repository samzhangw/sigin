<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4a90e2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>導師登入 - 第八節意願調查系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="teacher-styles.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://challenges.cloudflare.com">
</head>
<body>
  <header class="header">
    <h1><i class="fas fa-user-tie"></i> 導師登入</h1>
  </header>

  <main class="main-content">
    <div class="container">
      <div id="loginSection">
        <h2><i class="fas fa-chalkboard-teacher"></i> 導師專區登入</h2>
        <form id="teacherLoginForm">
          <label for="username"><i class="fas fa-user"></i> 帳號：</label>
          <input type="text" id="username" name="username" required>
          
          <label for="password"><i class="fas fa-key"></i> 密碼：</label>
          <div class="password-input-container">
            <input type="password" id="password" name="password" required>
            <button type="button" id="togglePassword" class="toggle-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          
          <div class="login-security">
            <span class="login-security-info">
              <i class="fas fa-shield-alt"></i> 提示: 如果忘記密碼，請聯繫系統管理員重設
            </span>
          </div>
          
          <div class="captcha-container">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAABA6Z9ZJMniYyMes"></div>
          </div>
          
          <button type="submit"><i class="fas fa-sign-in-alt"></i> 登入</button>
        </form>
        
        <div id="loginLoading" class="loading-container">
          <div class="spinner"></div>
          <p>登入中，請稍候...</p>
        </div>
        
        <div id="loginResult"></div>
      </div>
      
      <div id="teacherSection" style="display: none;">
        <div class="dashboard-header">
          <h3><i class="fas fa-chalkboard-teacher"></i> <span id="teacherName">導師</span> 的班級管理</h3>
          <p>您可以在這裡查看和管理 <span id="teacherClass">班級</span> 的所有調查資料</p>
        </div>
        
        <div class="stats-card">
          <div class="stats-header">
            <div class="stats-title"><i class="fas fa-chart-pie"></i> 班級填寫統計</div>
          </div>
          <div id="classSummary" class="class-summary">
            <div class="class-stats-loading">載入中...</div>
          </div>
        </div>
        
        <div class="stats-card">
          <div class="stats-header">
            <div class="stats-title"><i class="fas fa-list"></i> 學生明細</div>
            <div class="stats-actions">
              <button id="printClassBtn" class="stats-action-btn">
                <i class="fas fa-print"></i> 列印報表
              </button>
              <button id="exportClassBtn" class="stats-action-btn">
                <i class="fas fa-file-export"></i> 匯出資料
              </button>
              <button id="refreshClassBtn" class="stats-action-btn">
                <i class="fas fa-sync-alt"></i> 重新整理
              </button>
            </div>
          </div>
          
          <table id="studentsTable" class="stats-table">
            <thead>
              <tr>
                <th>學號</th>
                <th>姓名</th>
                <th>意願</th>
                <th>不參加原因</th>
                <th>提交時間</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <!-- 學生資料將在這裡動態生成 -->
            </tbody>
          </table>
        </div>
      </div>
      
      <button class="return-button" onclick="location.href='index.html'">
        <i class="fas fa-arrow-left"></i> 返回調查系統
      </button>
      
      <button id="logoutButton" class="logout-button" style="display: none;">
        <i class="fas fa-sign-out-alt"></i> 登出系統
      </button>
    </div>
  </main>
  
  <div id="alertModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-exclamation-circle"></i> 提示</h2>
      <p id="alertMessage"></p>
    </div>
  </div>
  
  <div id="studentDetailModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-user-graduate"></i> 學生詳細資料</h2>
      <div id="studentDetailContent"></div>
    </div>
  </div>

  <footer class="copyright">
    <span id="currentYear"></span> 第八節意願調查系統. 版權所有.
  </footer>

  <script src="teacher-script.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
