<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4a90e2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>導師登入 - 第八節意願調查系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-styles.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://challenges.cloudflare.com">
</head>
<body>
  <header class="header">
    <h1><i class="fas fa-chalkboard-teacher"></i> 導師管理系統</h1>
  </header>

  <main class="main-content">
    <div class="container">
      <div id="loginSection">
        <h2><i class="fas fa-lock"></i> 導師登入</h2>
        <form id="loginForm">
          <label for="username"><i class="fas fa-user"></i> 帳號：</label>
          <input type="text" id="username" name="username" required autocomplete="username">
          
          <label for="password"><i class="fas fa-key"></i> 密碼：</label>
          <div class="password-input-container">
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <button type="button" id="togglePassword" class="toggle-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          
          <div class="login-options">
            <label>
              <input type="checkbox" id="rememberMe"> 記住我
            </label>
            <a href="#" id="forgotPassword">忘記密碼?</a>
          </div>
          
          <div class="captcha-container">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAABA6Z9ZJMniYyMes"></div>
          </div>
          
          <button type="submit"><i class="fas fa-sign-in-alt"></i> 登入</button>
        </form>
        
        <div id="loginLoading" class="loading-container">
          <div class="spinner"></div>
          <p>登入中，請稍候...</p>
        </div>
        
        <div id="loginResult"></div>
      </div>
      
      <div id="teacherDashboard" style="display: none;">
        <div class="dashboard-header">
          <h3><i class="fas fa-tachometer-alt"></i> 導師控制台</h3>
          <p>歡迎使用第八節調查系統導師介面，您可以在這裡查看班級填寫狀況及管理學生資料。</p>
          <div class="server-time" id="serverTime">載入中...</div>
        </div>

        <div class="stats-card">
          <div class="stats-header">
            <div class="stats-title"><i class="fas fa-users"></i> <span id="classTitle">班級填寫狀況</span></div>
            <div class="stats-actions">
              <button id="refreshClassStats" class="stats-action-btn">
                <i class="fas fa-sync-alt"></i> 刷新資料
              </button>
              <button id="exportClassData" class="stats-action-btn">
                <i class="fas fa-file-export"></i> 匯出資料
              </button>
              <button id="sendBulkReminder" class="stats-action-btn">
                <i class="fas fa-bell"></i> 批次提醒
              </button>
            </div>
          </div>
          
          <div id="classStats">
            <!-- Class statistics will be displayed here -->
          </div>
          
          <div id="studentListContainer">
            <h3><i class="fas fa-user-graduate"></i> 學生填寫明細</h3>
            <table id="studentListTable" class="stats-table">
              <thead>
                <tr>
                  <th>學號</th>
                  <th>姓名</th>
                  <th>意願</th>
                  <th>不參加原因</th>
                  <th>提交時間</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <!-- Student list will be dynamically generated -->
              </tbody>
            </table>
            
            <div class="export-tools">
              <button id="printClassReport" class="export-tool-btn">
                <i class="fas fa-print"></i> 列印班級報表
              </button>
              <button id="exportStudentList" class="export-tool-btn">
                <i class="fas fa-file-csv"></i> 匯出學生列表
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <button class="return-button" onclick="location.href='index.html'">
        <i class="fas fa-arrow-left"></i> 返回意願調查
      </button>
    </div>
  </main>
  
  <div id="alertModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-exclamation-circle"></i> 提示</h2>
      <p id="alertMessage"></p>
    </div>
  </div>

  <div id="studentDetailModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-user-graduate"></i> 學生提交詳情</h2>
      <div id="studentDetailContent">
        <!-- Student details will be displayed here -->
      </div>
    </div>
  </div>

  <footer class="copyright">
    <span id="currentYear"></span> 第八節意願調查系統. 版權所有.
  </footer>

  <script src="teacher-script.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
