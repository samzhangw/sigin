<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>調查系統管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
  <header class="header">
    <h1><i class="fas fa-cog"></i> 調查系統管理</h1>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="admin-tabs">
        <div class="admin-tab active" data-tab="settingsTab"><i class="fas fa-calendar-alt"></i> 時間設定</div>
        <div class="admin-tab" data-tab="statsTab"><i class="fas fa-chart-bar"></i> 填寫統計</div>
      </div>
      
      <div id="settingsTab" class="admin-tab-content active">
        <h2><i class="fas fa-calendar-alt"></i> 系統時間設定</h2>
        
        <form id="adminForm">
          <label for="openTime"><i class="fas fa-door-open"></i> 開放時間：</label>
          <input type="datetime-local" id="openTime" name="openTime">
          
          <label for="closeTime"><i class="fas fa-door-closed"></i> 關閉時間：</label>
          <input type="datetime-local" id="closeTime" name="closeTime">
          
          <div id="currentSettings" class="current-settings">
            <h3>當前設定</h3>
            <p id="currentOpenTime">開放時間：尚未設定</p>
            <p id="currentCloseTime">關閉時間：尚未設定</p>
          </div>
          
          <button type="submit"><i class="fas fa-save"></i> 保存設定</button>
        </form>
        
        <div id="adminLoading" class="loading-container">
          <div class="spinner"></div>
          <p>處理中，請稍候...</p>
        </div>
        
        <div id="adminResult"></div>
      </div>
      
      <div id="statsTab" class="admin-tab-content">
        <h2><i class="fas fa-chart-bar"></i> 填寫狀況統計</h2>
        
        <div class="stats-card">
          <div class="stats-header">
            <div class="stats-title">概要統計</div>
          </div>
          <div class="stats-summary">
            <p>總填寫人數: <strong id="statsTotalSubmissions">0</strong></p>
            <p>參加人數: <strong id="statsParticipateCount">0</strong> (比例: <span id="statsParticipatePercent">0%</span>)</p>
            <p>不參加人數: <strong id="statsNotParticipateCount">0</strong></p>
          </div>
        </div>
        
        <div class="stats-card">
          <div class="stats-header">
            <div class="stats-title">各班統計</div>
          </div>
          <div id="classStatistics" class="class-stats">
            <!-- 班級統計將在這裡動態生成 -->
          </div>
        </div>
        
        <div class="stats-card">
          <div class="stats-header">
            <div class="stats-title">填寫明細</div>
            <div class="stats-actions">
              <button id="exportCSV" class="stats-action-btn">
                <i class="fas fa-file-csv"></i> 匯出 CSV
              </button>
            </div>
          </div>
          
          <div class="search-filter">
            <input type="text" id="submissionSearch" placeholder="搜尋學號、姓名或班級...">
          </div>
          
          <div class="intention-filter">
            <label>
              <input type="checkbox" id="filterYes" checked> 參加
            </label>
            <label>
              <input type="checkbox" id="filterNo" checked> 不參加
            </label>
          </div>
          
          <table id="submissionsTable" class="stats-table">
            <thead>
              <tr>
                <th>學號</th>
                <th>姓名</th>
                <th>班級</th>
                <th>意願</th>
                <th>不參加原因</th>
                <th>提交時間</th>
              </tr>
            </thead>
            <tbody>
              <!-- 填寫資料將在這裡動態生成 -->
            </tbody>
          </table>
        </div>
        
        <div id="statsLoading" class="loading-container">
          <div class="spinner"></div>
          <p>載入統計資料中，請稍候...</p>
        </div>
      </div>
      
      <button class="return-button" onclick="location.href='index.html'">
        <i class="fas fa-arrow-left"></i> 返回調查系統
      </button>
    </div>
  </main>
  
  <div id="adminAlertModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fas fa-exclamation-circle"></i> 提示</h2>
      <p id="adminAlertMessage"></p>
    </div>
  </div>

  <div id="adminConfirmModal" class="confirm-modal">
    <div class="confirm-content">
      <h2><i class="fas fa-question-circle"></i> 確認更改</h2>
      <p>您確定要更改系統開放時間設定嗎？</p>
      <div class="confirm-buttons">
        <button id="confirmAdmin"><i class="fas fa-check"></i> 確認</button>
        <button id="cancelAdmin"><i class="fas fa-times"></i> 取消</button>
      </div>
    </div>
  </div>

  <footer class="copyright">
    2024 第八節意願調查系統. 版權所有.
  </footer>

  <script src="admin-script.js"></script>
</body>
</html>
